name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv /tmp/openkit-ai-smoke
          /tmp/openkit-ai-smoke/bin/python -m pip install --no-deps dist/*.whl
      - name: Smoke-test installed package outside the repository
        run: |
          cd /tmp
          /tmp/openkit-ai-smoke/bin/python -c "import openkit_ai; assert openkit_ai.__version__ == '0.12.0'; assert callable(openkit_ai.parse_json_response); assert callable(openkit_ai.validate_json_response); print(openkit_ai.__version__)"
